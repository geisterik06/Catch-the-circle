<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Fang den Kreis</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
  <script src="spiel.js" defer></script>
</head>
<body>
  <div id="startmenu" class="centered">
    <h1>🎯 Fang den Kreis</h1>

    <label for="dauer">Spieldauer:</label>
    <select id="dauer">
      <option value="30">30 Sekunden</option>
      <option value="60">60 Sekunden</option>
      <option value="90">90 Sekunden</option>
    </select>

    <br><br>

    <label for="geschwindigkeit">Schwierigkeit:</label>
    <select id="geschwindigkeit">
      <option value="2000">Langsam</option>
      <option value="1000">Mittel</option>
      <option value="500">Schnell</option>
    </select>

    <br><br>

    <label for="modus">Modus:</label>
    <select id="modus">
      <option value="1">Einzelspieler</option>
      <option value="2">Zwei Spieler</option>
    </select>

    <br><br>
    <button id="startButton">🎮 Spiel starten</button>

    <h2>🏆 Highscores</h2>
    <div id="highscoreList"></div>
  </div>
</body>
</html>
